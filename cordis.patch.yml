# dsh-ui-balance 的 bundle 层：让 `dsh plugin add dsh-ui-balance` 装完就能用。
#
# 没有这个文件（以及 package.json 的 `dsh.bundle`），dsh 的 plugin 命令只会打印
#   warning: dsh-ui-balance declares no dsh.bundle — installed as a plain dependency
# 然后把包装进去、**永远不激活**，用户得自己手写 patch 才能看到东西。
#
# 对 dsDesktop 发行版而言这一层是惰性的：桌面端的安装路径只往 dsh 的
# package.json dependencies 里登记，不碰 profile 的 `dsh.profile.bundles`，
# 激活由启动时的 `--patch` overlay 提供。id 与 overlay 保持同一个值，
# 万一两条路径真被同时启用，失败会是响亮的 `duplicate loader entry id`
# （内核秒退、日志写明原因），而不是插件被静默挂载两次、路由重复注册。

- insert:
    - id: dsdesktop-balance
      name: '@easytz/dsh-ui-balance'
